<P><STRONG><FONT color=#800000>角色创建</FONT></STRONG></P>
<P>dh1e中，玩家角色创建主要有六个步骤和两大要素。</P>
<P><STRONG><FONT color=#800000>六个步骤</FONT></STRONG></P>
<P>源自dh01核心规则，是一切dh1e角色创建的基础。</P>
<P><STRONG><FONT color=#800000>两大要素</FONT></STRONG></P>
<P>一是在dh04审判官手册最初更新的背景包内容，该内容在后续更新中进一步完善。<BR>可以给玩家提供更丰富的角色创建内容。</P>
<P>二是同样在dh04审判官手册最初更新的精英进阶内容，该内容在后续更新中进一步完善。<BR>可以给玩家在角色创建和后续游玩中，都提供更丰富的内容，并允许GM和玩家使用精英进阶，制作更多自定义内容。</P></body>
